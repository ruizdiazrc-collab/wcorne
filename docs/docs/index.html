<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireless Corne – Capas</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fafafa;color:#222}
h1{font-size:1.4rem}h2{font-size:1.05rem;margin:28px 0 8px}p{max-width:900px;line-height:1.5}img{max-width:100%;height:auto;background:#fff;border:1px solid #ddd;border-radius:8px}
@media(prefers-color-scheme:dark){body{background:#161616;color:#eee}img{border-color:#333}}</style></head>
<body><h1>Wireless Corne – capas del teclado</h1>
<p>Las teclas resaltadas son las que hay que mantener apretadas para estar en esa capa.</p>
<h2>Capa 0 · Base</h2><img src="layers/base.svg" alt="Base">
<h2>Capa 1 · Num (mantener el pulgar izquierdo interno)</h2><img src="layers/num.svg" alt="Num">
<h2>Capa 2 · Numpad (sin acceso desde Base)</h2><img src="layers/numpad.svg" alt="Numpad">
<h2>Capa 3 · Sym (mantener Num y después el pulgar derecho del medio)</h2><img src="layers/sym.svg" alt="Sym">
</body></html>
